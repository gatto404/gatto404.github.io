<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>g a t t o 4 0 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #b7e4c7, #74c69d);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      background: #f0fff4;
      padding: 2rem 2.5rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
      max-width: 340px;
      width: 90%;
      border: 3px dashed #52b788;
      z-index: 10;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    .cat-kaomoji {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      animation: vibrate 0.5s infinite linear;
    }

    p {
      margin: 0.5rem 0 1.5rem;
    }

    a {
      display: block;
      margin: 1rem 0;
      padding: 0.9rem;
      border-radius: 16px;
      text-decoration: none;
      background: #52b788;
      color: white;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    a:hover {
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      opacity: 0.7;
    }

    @keyframes vibrate {
      0%, 100%  { transform: translate(0px, 0px); }
      10%, 60%  { transform: translate(-4px, 2px); }
      20%, 70%  { transform: translate(2px, -4px); }
      30%, 80%  { transform: translate(-2px, 4px); }
      40%, 90%  { transform: translate(4px, -2px); }
      50%  { transform: translate(-3px, -3px); }
    }

    .falling-cat {
      position: fixed;
      top: -100px;
      background-size: contain;
      background-repeat: no-repeat;
      z-index: 5;
      pointer-events: none;
      animation: fall 6s linear infinite;
      animation-fill-mode: both;
    }

    @keyframes fall {
      0% { transform: translateY(-120px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.7; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="cat-kaomoji">ฅ₍^•⩊ •マⳊ</div>
    <h1>💚gatto404💚</h1>
    <p>bonjour</p>

    <a href="https://github.com/gatto404">GitHub</a>
    <a href="https://www.linkedin.com/in/sara-lissignoli/">LinkedIn</a>
    <a href="https://instagram.com/sara_lissi">Instagram</a>
  </div>

  <script>
    const howManyCats = 50;
    const catImages = [
      "https://i.imgur.com/DjUyLDT.png", 
    ];

    for (let i = 0; i < howManyCats; i++) {
      const cat = document.createElement("div");
      cat.className = "falling-cat";
      cat.style.left = (Math.random() * 120 - 10) + "vw";
      cat.style.animationDelay = Math.random() * 5 + "s";
      const sizeVw = 3 + Math.random() * 4;
      cat.style.width = sizeVw + "vw";
      cat.style.height = sizeVw + "vw"; 
      cat.style.backgroundImage = `url(${catImages[Math.floor(Math.random() * catImages.length)]})`;
      document.body.appendChild(cat);
    }
  </script>
</body>
</html>
